<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Krieg Senki</title>
    <style>
        :root {
            --bg: #17131d;
            --card-bg: #1c1624;
            --card-hover: #241d2e;
            --text: #cdc2b8;
            --text-soft: #8a8088;
            --heading: #c8bcb4;
            --silver: #a8a8b8;
            --silver-soft: #807f8c;
            --red: #8c1a28;
            --red-bright: #b01828;
            --mauve: #8a6a88;
            --alice: #a0b8d0;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 19px;
            line-height: 1.9;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .deco { width: 100%; position: relative; pointer-events: none; }
        .deco.top { margin-bottom: -30px; }

        .mirror-strip { width: 100%; height: 130px; display: block; }

        .lycoris {
            position: absolute;
            width: 130px; height: 130px;
            z-index: 3;
            pointer-events: none;
        }
        .lycoris.h1 { top: 20px; left: 8%; }
        .lycoris.h2 { top: 0; left: 33%; }
        .lycoris.h3 { top: 30px; left: 60%; }
        .lycoris.h4 { top: 5px; right: 12%; }
        .lycoris.small { width: 75px; height: 75px; opacity: 0.7; }

        .vine {
            position: fixed;
            top: 0; bottom: 0;
            width: 70px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.55;
        }
        .vine.left { left: 0; }
        .vine.right { right: 0; transform: scaleX(-1); }
        .vine svg { width: 100%; height: 100%; }

        main {
            max-width: 480px;
            margin: 0 auto;
            padding: 60px 30px 110px;
            position: relative;
            z-index: 4;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 2px;
            color: var(--heading);
            text-align: center;
            margin: 0 0 40px;
            text-shadow:
                0 0 18px rgba(200, 200, 220, 0.55),
                0 0 40px rgba(176, 24, 40, 0.28);
        }

        .divider {
            width: 100px;
            height: 1px;
            margin: 0 auto 40px;
            background: linear-gradient(to right, transparent, var(--silver-soft), transparent);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        label {
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--silver);
            margin-bottom: 4px;
            display: block;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            background: var(--card-bg);
            border: 1px solid rgba(168, 168, 184, 0.25);
            border-radius: 4px;
            color: var(--text);
            font-family: Georgia, serif;
            font-size: 17px;
            transition: border-color 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--red);
        }

        button {
            margin-top: 16px;
            padding: 14px 20px;
            background: var(--card-bg);
            border: 1px solid var(--silver-soft);
            border-radius: 4px;
            color: var(--heading);
            font-family: Georgia, serif;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        button:hover {
            background: var(--card-hover);
            border-color: var(--red-bright);
            color: var(--red-bright);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: 4px;
            font-size: 15px;
            display: none;
        }

        .message.visible { display: block; }

        .message.error {
            background: rgba(140, 26, 40, 0.15);
            border-left: 3px solid var(--red-bright);
            color: #e0a8a8;
        }

        .message.success {
            background: rgba(160, 184, 208, 0.1);
            border-left: 3px solid var(--alice);
            color: var(--alice);
        }

        .connected {
            display: none;
            text-align: center;
        }

        .connected.visible { display: block; }

        .connected p {
            margin-bottom: 20px;
        }

        .connected .email {
            color: var(--alice);
            font-style: italic;
        }

        .dashboard-link {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 26px;
            background: var(--card-bg);
            border: 1px solid var(--silver-soft);
            border-radius: 4px;
            color: var(--heading);
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 14px;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .dashboard-link:hover {
            background: var(--card-hover);
            border-color: var(--red-bright);
            color: var(--red-bright);
        }

        @media (max-width: 800px) {
            body { font-size: 17px; }
            h1 { font-size: 23px; }
            main { padding: 40px 20px 80px; }
            .mirror-strip { height: 80px; }
            .lycoris { width: 80px; height: 80px; }
            .lycoris.small { width: 50px; height: 50px; }
            .vine { width: 40px; opacity: 0.4; }
        }
    </style>
</head>

<main>
    <h1>Administration</h1>
    <div class="divider"></div>

    <!-- Formulaire de connexion -->
    <div id="login-bloc">
        <form id="login-form">
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" required autocomplete="email">
            </div>
            <div>
                <label for="password">Mot de passe</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" id="login-btn">Se connecter</button>
        </form>
        <div class="message" id="message"></div>
    </div>

    <!-- Affiché quand déjà connecté -->
    <div class="connected" id="connected-bloc">
        <p>Connecté en tant que <span class="email" id="user-email"></span></p>
        <button id="logout-btn">Se déconnecter</button>
        <br>
        <a href="dashboard.html" class="dashboard-link">Aller au tableau de bord</a>
    </div>
</main>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data/config.js"></script>
<script src="data/api.js"></script>
<script>
    const loginBloc = document.getElementById("login-bloc");
    const connectedBloc = document.getElementById("connected-bloc");
    const emailSpan = document.getElementById("user-email");
    const messageEl = document.getElementById("message");
    const form = document.getElementById("login-form");
    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");

    function afficherMessage(texte, type) {
        messageEl.textContent = texte;
        messageEl.className = "message visible " + type;
    }

    function cacherMessage() {
        messageEl.className = "message";
    }

    function afficherConnecte(user) {
        loginBloc.style.display = "none";
        connectedBloc.classList.add("visible");
        emailSpan.textContent = user.email;
    }

    function afficherDeconnecte() {
        loginBloc.style.display = "block";
        connectedBloc.classList.remove("visible");
        form.reset();
    }

    // Vérifie s'il y a déjà une session active
    async function verifierSession() {
        const { data } = await sb.auth.getSession();
        if (data && data.session && data.session.user) {
            afficherConnecte(data.session.user);
        } else {
            afficherDeconnecte();
        }
    }

    // Connexion
    form.addEventListener("submit", async function (e) {
        e.preventDefault();
        cacherMessage();
        loginBtn.disabled = true;
        loginBtn.textContent = "Connexion…";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } = await sb.auth.signInWithPassword({
            email: email,
            password: password
        });

        loginBtn.disabled = false;
        loginBtn.textContent = "Se connecter";

        if (error) {
            afficherMessage("Échec : " + error.message, "error");
            return;
        }

        afficherMessage("Connexion réussie.", "success");
        afficherConnecte(data.user);
    });

    // Déconnexion
    logoutBtn.addEventListener("click", async function () {
        await sb.auth.signOut();
        afficherDeconnecte();
        cacherMessage();
    });

    // Au chargement
    verifierSession();
</script>

</body>
