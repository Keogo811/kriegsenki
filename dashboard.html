<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord — Krieg Senki</title>
    <style>
        :root {
            --bg: #17131d;
            --card-bg: #1c1624;
            --card-hover: #241d2e;
            --text: #cdc2b8;
            --text-soft: #8a8088;
            --heading: #c8bcb4;
            --silver: #a8a8b8;
            --silver-soft: #807f8c;
            --red: #8c1a28;
            --red-bright: #b01828;
            --mauve: #8a6a88;
            --alice: #a0b8d0;
            --border: rgba(168, 168, 184, 0.2);
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 16px;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ---- En-tête sticky ---- */
        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-titre {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--heading);
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .header-user {
            font-size: 13px;
            color: var(--text-soft);
            font-style: italic;
        }

        .btn {
            display: inline-block;
            padding: 8px 16px;
            background: var(--card-bg);
            border: 1px solid var(--silver-soft);
            border-radius: 3px;
            color: var(--heading);
            font-family: Georgia, serif;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .btn:hover {
            background: var(--card-hover);
            border-color: var(--red-bright);
            color: var(--red-bright);
        }

        .btn.small { padding: 5px 10px; font-size: 11px; }
        .btn.primary { border-color: var(--red); color: var(--red-bright); }
        .btn.primary:hover { background: rgba(140, 26, 40, 0.15); }

        /* ---- Bandeau décoratif miroir ---- */
        .deco-bandeau {
            width: 100%;
            height: 100px;
            position: relative;
            pointer-events: none;
            overflow: hidden;
        }

        .deco-bandeau svg.mirror-strip {
            width: 100%;
            height: 100%;
            display: block;
        }

        .lycoris {
            position: absolute;
            pointer-events: none;
            z-index: 2;
        }
        .lycoris.s1 { width: 95px; height: 95px; }
        .lycoris.s2 { width: 70px; height: 70px; opacity: 0.85; }
        .lycoris.s3 { width: 55px; height: 55px; opacity: 0.7; }
        .lycoris.s4 { width: 45px; height: 45px; opacity: 0.55; }

        /* Positions dans le bandeau haut */
        .top-banner .lycoris:nth-child(2) { top: 10px; left: 3%; }
        .top-banner .lycoris:nth-child(3) { top: 30px; left: 12%; }
        .top-banner .lycoris:nth-child(4) { top: 5px; left: 22%; }
        .top-banner .lycoris:nth-child(5) { top: 40px; left: 31%; }
        .top-banner .lycoris:nth-child(6) { top: 15px; left: 42%; }
        .top-banner .lycoris:nth-child(7) { top: 35px; left: 52%; }
        .top-banner .lycoris:nth-child(8) { top: 8px; left: 63%; }
        .top-banner .lycoris:nth-child(9) { top: 42px; left: 73%; }
        .top-banner .lycoris:nth-child(10) { top: 12px; left: 83%; }
        .top-banner .lycoris:nth-child(11) { top: 38px; left: 92%; }

        /* Positions dans le bandeau bas */
        .bottom-banner .lycoris:nth-child(1) { bottom: 10px; left: 5%; }
        .bottom-banner .lycoris:nth-child(2) { bottom: 30px; left: 15%; }
        .bottom-banner .lycoris:nth-child(3) { bottom: 5px; left: 26%; }
        .bottom-banner .lycoris:nth-child(4) { bottom: 35px; left: 37%; }
        .bottom-banner .lycoris:nth-child(5) { bottom: 15px; left: 48%; }
        .bottom-banner .lycoris:nth-child(6) { bottom: 40px; left: 59%; }
        .bottom-banner .lycoris:nth-child(7) { bottom: 8px; left: 70%; }
        .bottom-banner .lycoris:nth-child(8) { bottom: 32px; left: 81%; }
        .bottom-banner .lycoris:nth-child(9) { bottom: 12px; left: 92%; }

        /* ---- Contenu principal ---- */
        main {
            max-width: 1080px;
            margin: 0 auto;
            padding: 30px 24px 60px;
        }

        .barre-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 26px;
        }

        .intro {
            color: var(--text-soft);
            font-size: 14px;
            font-style: italic;
            margin: 0;
        }

        /* ---- Boîte ---- */
        .boite {
            background: rgba(28, 22, 36, 0.5);
            border: 1px solid var(--border);
            border-left: 3px solid var(--mauve);
            border-radius: 4px;
            margin-bottom: 26px;
            padding: 0;
            overflow: hidden;
        }

        .boite-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: rgba(138, 106, 136, 0.08);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .boite-titre {
            font-size: 17px;
            letter-spacing: 1px;
            color: var(--heading);
            flex: 1;
            cursor: pointer;
            min-width: 150px;
        }

        .boite-titre:hover { color: var(--red-bright); }

        .boite-nb {
            font-size: 12px;
            color: var(--text-soft);
            font-family: Consolas, monospace;
            letter-spacing: 1px;
        }

        .boite-toggle {
            font-size: 14px;
            color: var(--silver);
            width: 16px;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }

        .boite-contenu {
            padding: 12px;
        }

        /* ---- Arc ---- */
        .arc-bloc {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-left: 3px solid var(--red);
            border-radius: 4px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .arc-bloc:last-child { margin-bottom: 0; }

        .arc-header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s ease;
        }

        .arc-header:hover {
            background: rgba(168, 168, 184, 0.04);
        }

        .arc-toggle {
            font-size: 14px;
            color: var(--silver);
            width: 16px;
            text-align: center;
        }

        .arc-header-titre {
            font-size: 16px;
            color: var(--heading);
            flex: 1;
            min-width: 180px;
        }

        .arc-header-id {
            font-size: 11px;
            color: var(--text-soft);
            font-family: Consolas, monospace;
        }

        /* ---- Badge nombre d'actes, bien visible ---- */
        .arc-nb-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: rgba(140, 26, 40, 0.18);
            border: 1px solid rgba(176, 24, 40, 0.4);
            border-radius: 999px;
            font-family: Consolas, monospace;
            font-size: 13px;
            letter-spacing: 1px;
            color: #e0a8b0;
            font-weight: bold;
        }

        .arc-nb-badge .nb {
            font-size: 16px;
            color: #ffd0d6;
        }

        /* ---- Statut ---- */
        .statut {
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 3px;
        }
        .statut.publie { color: var(--alice); background: rgba(160, 184, 208, 0.1); }
        .statut.redaction { color: var(--mauve); background: rgba(138, 106, 136, 0.1); }
        .statut.brouillon { color: var(--text-soft); background: rgba(138, 128, 136, 0.1); }

        /* ---- Sélecteur de boîte dans un arc ---- */
        .boite-select {
            background: var(--bg);
            border: 1px solid var(--silver-soft);
            color: var(--text);
            padding: 5px 8px;
            border-radius: 3px;
            font-family: Georgia, serif;
            font-size: 12px;
            cursor: pointer;
            max-width: 140px;
        }

        .boite-select:hover { border-color: var(--red-bright); }

        /* ---- Liste des actes ---- */
        .actes-liste {
            padding: 4px 0 8px;
            border-top: 1px solid rgba(168, 168, 184, 0.08);
        }

        .acte-ligne {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 18px;
            border-bottom: 1px solid rgba(168, 168, 184, 0.06);
            flex-wrap: wrap;
        }

        .acte-ligne:last-child { border-bottom: none; }

        .acte-num {
            font-size: 12px;
            color: var(--silver);
            min-width: 60px;
            font-family: Consolas, monospace;
        }

        .acte-titre {
            flex: 1;
            font-size: 14px;
            color: var(--text);
            min-width: 180px;
        }

        .acte-id {
            font-size: 11px;
            color: var(--text-soft);
            font-family: Consolas, monospace;
            min-width: 70px;
        }

        .vide {
            padding: 12px 18px;
            color: var(--text-soft);
            font-size: 13px;
            font-style: italic;
        }

        /* ---- Boutons ↑ / ↓ pour réordonner ---- */
        .ordre-btns {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .ordre-btn {
            width: 26px;
            height: 26px;
            padding: 0;
            background: var(--card-bg);
            border: 1px solid var(--silver-soft);
            border-radius: 3px;
            color: var(--silver);
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .ordre-btn:hover:not(:disabled) {
            background: var(--card-hover);
            border-color: var(--red-bright);
            color: var(--red-bright);
        }

        .ordre-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        /* ---- Messages ---- */
        .message {
            padding: 14px 18px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .message.error {
            background: rgba(140, 26, 40, 0.15);
            border-left: 3px solid var(--red-bright);
            color: #e0a8a8;
        }
        .message.loading {
            color: var(--text-soft);
            font-style: italic;
        }

        @media (max-width: 700px) {
            .modal-overlay { padding: 0; align-items: stretch; }
            .modal {
                max-width: none;
                max-height: none;
                border-radius: 0;
                border-left: none;
                border-top: 3px solid var(--red);
            }
            .modal-corps { padding: 16px; }
            .champ textarea { min-height: 260px; }
        }

        @media (max-width: 700px) {
            main { padding: 20px 14px 40px; }
            header { padding: 12px 14px; }
            .arc-header, .acte-ligne, .boite-header { padding: 12px 14px; }
            .acte-num { min-width: auto; }
            .acte-titre { min-width: 100%; }
            .deco-bandeau { height: 70px; }
            .lycoris.s1 { width: 60px; height: 60px; }
            .lycoris.s2 { width: 45px; height: 45px; }
            .lycoris.s3 { width: 35px; height: 35px; }
            .lycoris.s4 { width: 28px; height: 28px; }
        }
    </style>
</head>
<body>

<!-- BANDEAU DÉCORATIF BAS -->
<div class="deco-bandeau bottom-banner">
    <svg class="mirror-strip" viewBox="0 0 1200 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="voidDepthBot" x1="0" y1="1" x2="0" y2="0">

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data/config.js"></script>
<script src="data/api.js"></script>
<script>
    const contenu = document.getElementById("contenu");
    const headerUser = document.getElementById("header-user");
    const btnNouvelleBoite = document.getElementById("btn-nouvelle-boite");

    let toutesLesBoites = [];
    let tousLesArcs = [];
    let actesParArc = {};

    async function verifierAuth() {
        const { data } = await sb.auth.getSession();
        if (!data || !data.session || !data.session.user) {
            window.location.replace("admin.html");
            return null;
        }
        return data.session.user;
    }

    async function chargerTout() {
        contenu.innerHTML = '<p class="message loading">Chargement…</p>';
        try {
            toutesLesBoites = await chargerBoites();
            tousLesArcs = await chargerArcsTous();

            // Charger les actes pour chaque arc (en série pour simplicité)
            actesParArc = {};
            for (const arc of tousLesArcs) {
            actesParArc[arc.id] = await chargerActesParArcTous(arc.id);
            }

            afficherTout();
        } catch (err) {
            console.error(err);
            contenu.innerHTML = '<p class="message error">Erreur : ' + err.message + '</p>';
        }
    }

    function afficherTout() {
        contenu.innerHTML = "";

        // 1. Boîtes
        for (const boite of toutesLesBoites) {
            contenu.appendChild(construireBlocBoite(boite));
        }

        // 2. Section "Sans boîte"
        const arcsSansBoite = tousLesArcs.filter(a => !a.boite_id);
        if (arcsSansBoite.length > 0) {
            contenu.appendChild(construireBlocSansBoite(arcsSansBoite));
        }

        if (toutesLesBoites.length === 0 && arcsSansBoite.length === 0) {
            contenu.innerHTML = '<p class="message loading">Aucun arc dans la base.</p>';
        }
    }

    function construireBlocBoite(boite) {
        const arcs = tousLesArcs.filter(a => a.boite_id === boite.id);

        const bloc = document.createElement("div");
        bloc.className = "boite";

        const header = document.createElement("div");
        header.className = "boite-header";

        const toggle = document.createElement("span");
        toggle.className = "boite-toggle";
        toggle.textContent = "▾";
        header.appendChild(toggle);

        const titre = document.createElement("div");
        titre.className = "boite-titre";
        titre.textContent = boite.nom;
        titre.title = "Cliquer pour renommer";
        titre.addEventListener("click", function (e) {
            e.stopPropagation();
            renommerBoiteUI(boite);
        });
        header.appendChild(titre);

        const nbEl = document.createElement("span");
        nbEl.className = "boite-nb";
        nbEl.textContent = arcs.length + (arcs.length > 1 ? " arcs" : " arc");
        header.appendChild(nbEl);

        const btnSuppr = document.createElement("button");
        btnSuppr.className = "btn small";
        btnSuppr.textContent = "Supprimer";
        btnSuppr.title = "Supprimer cette boîte (les arcs reviendront dans Sans boîte)";
        btnSuppr.addEventListener("click", function (e) {
            e.stopPropagation();
            supprimerBoiteUI(boite);
        });
        header.appendChild(btnSuppr);

        bloc.appendChild(header);

        const corps = document.createElement("div");
        corps.className = "boite-contenu";

        if (arcs.length === 0) {
            const vide = document.createElement("div");
            vide.className = "vide";
            vide.textContent = "Aucun arc dans cette boîte. Utilise le sélecteur d'un arc pour le déplacer ici.";
            corps.appendChild(vide);
        } else {
            arcs.forEach(arc => corps.appendChild(construireBlocArc(arc)));
        }

        bloc.appendChild(corps);

        // Clic sur la flèche : plier/déplier
        toggle.addEventListener("click", function () {
            const ouvert = corps.style.display !== "none";
            corps.style.display = ouvert ? "none" : "block";
            toggle.textContent = ouvert ? "▸" : "▾";
        });

        return bloc;
    }

    // Retourne la liste des arcs du même contexte (même boîte, ou sans boîte)
    // afin de gérer le réordonnancement à l'intérieur de ce groupe.
    function obtenirArcsDuContexte(arc) {
        if (arc.boite_id) {
            return tousLesArcs.filter(a => a.boite_id === arc.boite_id);
        }
        return tousLesArcs.filter(a => !a.boite_id);
    }

    function construireBlocSansBoite(arcs) {
        const bloc = document.createElement("div");
        bloc.className = "boite";
        bloc.style.borderLeftColor = "var(--silver-soft)";

        const header = document.createElement("div");
        header.className = "boite-header";
        header.style.background = "rgba(168, 168, 184, 0.04)";

        const toggle = document.createElement("span");
        toggle.className = "boite-toggle";
        toggle.textContent = "▾";
        header.appendChild(toggle);

        const titre = document.createElement("div");
        titre.className = "boite-titre";
        titre.textContent = "Sans boîte";
        titre.style.cursor = "default";
        titre.style.fontStyle = "italic";
        header.appendChild(titre);

        const nbEl = document.createElement("span");
        nbEl.className = "boite-nb";
        nbEl.textContent = arcs.length + (arcs.length > 1 ? " arcs" : " arc");
        header.appendChild(nbEl);

        bloc.appendChild(header);

        const corps = document.createElement("div");
        corps.className = "boite-contenu";
        arcs.forEach(arc => corps.appendChild(construireBlocArc(arc)));
        bloc.appendChild(corps);

        toggle.addEventListener("click", function () {
            const ouvert = corps.style.display !== "none";
            corps.style.display = ouvert ? "none" : "block";
            toggle.textContent = ouvert ? "▸" : "▾";
        });

        return bloc;
    }

    function construireBlocArc(arc) {
        const actes = actesParArc[arc.id] || [];

        const bloc = document.createElement("div");
        bloc.className = "arc-bloc";

        const header = document.createElement("div");
        header.className = "arc-header";

        // Boutons de réordonnancement
        const ordreBtns = document.createElement("div");
        ordreBtns.className = "ordre-btns";

        const arcsDuContexte = obtenirArcsDuContexte(arc);
        const indexArc = arcsDuContexte.findIndex(a => a.id === arc.id);
        const arcPrec = indexArc > 0 ? arcsDuContexte[indexArc - 1] : null;
        const arcSuiv = indexArc >= 0 && indexArc < arcsDuContexte.length - 1
            ? arcsDuContexte[indexArc + 1] : null;

        const btnUp = document.createElement("button");
        btnUp.className = "ordre-btn";
        btnUp.textContent = "↑";
        btnUp.title = "Monter cet arc";
        btnUp.disabled = !arcPrec;
        btnUp.addEventListener("click", async function (e) {
            e.stopPropagation();
            if (!arcPrec) return;
            try {
                await echangerOrdreArcs(arc, arcPrec);
                await chargerTout();
            } catch (err) { alert("Erreur : " + err.message); }
        });
        ordreBtns.appendChild(btnUp);

        const btnDown = document.createElement("button");
        btnDown.className = "ordre-btn";
        btnDown.textContent = "↓";
        btnDown.title = "Descendre cet arc";
        btnDown.disabled = !arcSuiv;
        btnDown.addEventListener("click", async function (e) {
            e.stopPropagation();
            if (!arcSuiv) return;
            try {
                await echangerOrdreArcs(arc, arcSuiv);
                await chargerTout();
            } catch (err) { alert("Erreur : " + err.message); }
        });
        ordreBtns.appendChild(btnDown);

        header.appendChild(ordreBtns);

        const toggle = document.createElement("span");
        toggle.className = "arc-toggle";
        toggle.textContent = "▸";
        header.appendChild(toggle);

        const titre = document.createElement("div");
        titre.className = "arc-header-titre";
        titre.textContent = arc.titre;
        header.appendChild(titre);

        // Badge bien visible
        const badge = document.createElement("span");
        badge.className = "arc-nb-badge";
        const nb = document.createElement("span");
        nb.className = "nb";
        nb.textContent = actes.length;
        badge.appendChild(nb);
        badge.appendChild(document.createTextNode(actes.length > 1 ? " actes" : " acte"));
        header.appendChild(badge);

        const idEl = document.createElement("div");
        idEl.className = "arc-header-id";
        idEl.textContent = arc.id;
        header.appendChild(idEl);

        const statut = document.createElement("span");
        statut.className = "statut " + arc.statut;
        statut.textContent = arc.statut;
        header.appendChild(statut);

        // Sélecteur de boîte
        const select = document.createElement("select");
        select.className = "boite-select";
        select.title = "Déplacer cet arc dans une boîte";

        const optSans = document.createElement("option");
        optSans.value = "";
        optSans.textContent = "Sans boîte";
        select.appendChild(optSans);

        toutesLesBoites.forEach(b => {
            const opt = document.createElement("option");
            opt.value = b.id;
            opt.textContent = b.nom;
            if (arc.boite_id === b.id) opt.selected = true;
            select.appendChild(opt);
        });

        select.addEventListener("click", e => e.stopPropagation());
        select.addEventListener("change", async function (e) {
            e.stopPropagation();
            const nouvelleBoite = select.value || null;
            try {
                await changerBoiteArc(arc.id, nouvelleBoite);
                await chargerTout();
            } catch (err) {
                alert("Erreur : " + err.message);
            }
        });
        header.appendChild(select);

        const btnModifier = document.createElement("button");
        btnModifier.className = "btn small";
        btnModifier.textContent = "Modifier";
        btnModifier.addEventListener("click", function (e) {
            e.stopPropagation();
            window.location.href = "editer-arc.html#" + arc.id;
        });
        header.appendChild(btnModifier);

        const btnSuppr = document.createElement("button");
        btnSuppr.className = "btn small";
        btnSuppr.textContent = "Supprimer";
        btnSuppr.title = "Supprimer définitivement cet arc et tous ses actes";
        btnSuppr.addEventListener("click", async function (e) {
            e.stopPropagation();
            const ok = confirm(
                "Supprimer l'arc \"" + arc.titre + "\" ?\n" +
                "Tous ses actes seront aussi supprimés. Action irréversible."
            );
            if (!ok) return;
            try {
                await supprimerArc(arc.id);
                await chargerTout();
            } catch (err) { alert("Erreur : " + err.message); }
        });
        header.appendChild(btnSuppr);

        bloc.appendChild(header);

        // Liste des actes
        const liste = document.createElement("div");
        liste.className = "actes-liste";
        liste.style.display = "none";

        if (actes.length === 0) {
            const vide = document.createElement("div");
            vide.className = "vide";
            vide.textContent = "Aucun acte dans cet arc.";
            liste.appendChild(vide);
        } else {
            actes.forEach(acte => liste.appendChild(construireLigneActe(acte)));
        }

        // Bouton "Nouvel acte"
        const ligneNouvel = document.createElement("div");
        ligneNouvel.className = "acte-ligne";
        ligneNouvel.style.justifyContent = "flex-start";

        const btnNouvelActe = document.createElement("button");
        btnNouvelActe.className = "btn small primary";
        btnNouvelActe.textContent = "+ Nouvel acte";
        btnNouvelActe.addEventListener("click", async function (e) {
            e.stopPropagation();
            const titre = prompt("Titre du nouvel acte :");
            if (!titre || !titre.trim()) return;
            try {
                const numero = await prochainNumeroActe(arc.id);
                const nouvelActe = await creerActe({
                    arc_id: arc.id,
                    numero: numero,
                    titre: titre.trim(),
                    statut: "brouillon",
                    contenu: ""
                });
                // On ouvre directement la page d'édition du nouvel acte
                window.location.href = "editer-acte.html#" + nouvelActe.id;
            } catch (err) {
                alert("Erreur : " + err.message);
            }
        });
        ligneNouvel.appendChild(btnNouvelActe);
        liste.appendChild(ligneNouvel);

        header.addEventListener("click", function () {
            const ouvert = liste.style.display === "block";
            liste.style.display = ouvert ? "none" : "block";
            toggle.textContent = ouvert ? "▸" : "▾";
        });

        bloc.appendChild(liste);
        return bloc;
    }

    function construireLigneActe(acte) {
        const ligne = document.createElement("div");
        ligne.className = "acte-ligne";

        // Boutons ↑ / ↓
        const ordreBtns = document.createElement("div");
        ordreBtns.className = "ordre-btns";

        const actesDeLArc = actesParArc[acte.arc_id] || [];
        const indexActe = actesDeLArc.findIndex(a => a.id === acte.id);
        const actePrec = indexActe > 0 ? actesDeLArc[indexActe - 1] : null;
        const acteSuiv = indexActe >= 0 && indexActe < actesDeLArc.length - 1
            ? actesDeLArc[indexActe + 1] : null;

        const btnUp = document.createElement("button");
        btnUp.className = "ordre-btn";
        btnUp.textContent = "↑";
        btnUp.title = "Monter cet acte";
        btnUp.disabled = !actePrec;
        btnUp.addEventListener("click", async function () {
            if (!actePrec) return;
            try {
                await echangerNumeroActes(acte, actePrec);
                await chargerTout();
            } catch (err) { alert("Erreur : " + err.message); }
        });
        ordreBtns.appendChild(btnUp);

        const btnDown = document.createElement("button");
        btnDown.className = "ordre-btn";
        btnDown.textContent = "↓";
        btnDown.title = "Descendre cet acte";
        btnDown.disabled = !acteSuiv;
        btnDown.addEventListener("click", async function () {
            if (!acteSuiv) return;
            try {
                await echangerNumeroActes(acte, acteSuiv);
                await chargerTout();
            } catch (err) { alert("Erreur : " + err.message); }
        });
        ordreBtns.appendChild(btnDown);

        ligne.appendChild(ordreBtns);

        const num = document.createElement("div");
        num.className = "acte-num";
        num.textContent = "Acte " + acte.numero;
        ligne.appendChild(num);

        const titre = document.createElement("div");
        titre.className = "acte-titre";
        titre.textContent = acte.titre;
        ligne.appendChild(titre);

        const idEl = document.createElement("div");
        idEl.className = "acte-id";
        idEl.textContent = acte.id;
        ligne.appendChild(idEl);

        const statut = document.createElement("span");
        statut.className = "statut " + acte.statut;
        statut.textContent = acte.statut;
        ligne.appendChild(statut);

        const btnModifier = document.createElement("button");
        btnModifier.className = "btn small";
        btnModifier.textContent = "Modifier";
        btnModifier.addEventListener("click", function (e) {
            e.stopPropagation();
            window.location.href = "editer-acte.html#" + acte.id;
        });
        ligne.appendChild(btnModifier);

        const btnSuppr = document.createElement("button");
        btnSuppr.className = "btn small";
        btnSuppr.textContent = "Supprimer";
        btnSuppr.addEventListener("click", async function (e) {
            e.stopPropagation();
            const ok = confirm("Supprimer l'acte \"" + acte.titre + "\" ? Action irréversible.");
            if (!ok) return;
            try {
                await supprimerActe(acte.id);
                await chargerTout();
            } catch (err) { alert("Erreur : " + err.message); }
        });
        ligne.appendChild(btnSuppr);

        return ligne;
    }

    // ---- Actions boîtes ----

    async function nouvelleBoiteUI() {
        const nom = prompt("Nom de la nouvelle boîte :");
        if (!nom || !nom.trim()) return;
        try {
            await creerBoite(nom.trim());
            await chargerTout();
        } catch (err) {
            alert("Erreur : " + err.message);
        }
    }

    async function renommerBoiteUI(boite) {
        const nouveau = prompt("Renommer la boîte :", boite.nom);
        if (!nouveau || !nouveau.trim() || nouveau.trim() === boite.nom) return;
        try {
            await renommerBoite(boite.id, nouveau.trim());
            await chargerTout();
        } catch (err) {
            alert("Erreur : " + err.message);
        }
    }

    async function supprimerBoiteUI(boite) {
        const ok = confirm("Supprimer la boîte \"" + boite.nom + "\" ?\nLes arcs qu'elle contient reviendront dans \"Sans boîte\".");
        if (!ok) return;
        try {
            await supprimerBoite(boite.id);
            await chargerTout();
        } catch (err) {
            alert("Erreur : " + err.message);
        }
    }

    // ---- Boutons globaux ----

    document.getElementById("logout-btn").addEventListener("click", async function () {
        await sb.auth.signOut();
        window.location.replace("admin.html");
    });

    btnNouvelleBoite.addEventListener("click", nouvelleBoiteUI);

    // ---- Nouvel arc ----

    document.getElementById("btn-nouvel-arc").addEventListener("click", nouvelArcUI);

    async function nouvelArcUI() {
        const titre = prompt("Titre du nouvel arc :");
        if (!titre || !titre.trim()) return;

        const id = prompt(
            "Identifiant technique (court, sans espaces) :",
            "arc-" + Date.now().toString(36)
        );
        if (!id || !id.trim()) return;

        const description = prompt("Description courte (apparaîtra sur l'accueil) :", "") || "";

        try {
            await creerArc({
                id: id.trim(),
                titre: titre.trim(),
                description: description.trim(),
                statut: "brouillon",
                ordre: 0
            });
            await chargerTout();
        } catch (err) {
            alert("Erreur : " + err.message);
        }
    }
    // ---- Init ----
    (async function init() {
        const user = await verifierAuth();
        if (!user) return;
        headerUser.textContent = user.email;
        await chargerTout();
    })();
</script>
