<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Univers — Krieg Senki</title>
    <style>
        :root {
            --bg: #0f0c14;
            --void: #060410;
            --card-bg: #1c1624;
            --text: #cdc2b8;
            --text-soft: #8a8088;
            --heading: #c8bcb4;
            --silver: #a8a8b8;
            --silver-bright: #d8d8e4;
            --silver-soft: #807f8c;
            --red: #8c1a28;
            --red-bright: #b01828;
            --mauve: #8a6a88;
            --alice: #a0b8d0;
            --pink: #d8a0b0;
            --border: rgba(168, 168, 184, 0.2);
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 16px;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ---- Éclats qui tombent (neutres) ---- */
        .shards-bg {
            position: fixed; inset: 0; overflow: hidden;
            pointer-events: none; z-index: 1;
        }
        .shard-fall {
            position: absolute; top: -120px;
            will-change: transform, opacity;
            animation-name: chute;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        @keyframes chute {
            0%   { transform: translateY(-120px) rotate(0deg);  opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(115vh) rotate(540deg); opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            .shard-fall { animation: none; display: none; }
        }

        /* ---- Étoiles figées ---- */
        .stars-bg {
            position: fixed; inset: 0; overflow: hidden;
            pointer-events: none; z-index: 2;
        }
        .star-fig {
            position: absolute;
            pointer-events: none;
            filter: drop-shadow(0 0 6px currentColor);
        }
        .star-fig.s { width: 8px; height: 8px; opacity: 0.6; }
        .star-fig.m { width: 14px; height: 14px; opacity: 0.8; }
        .star-fig.l { width: 20px; height: 20px; opacity: 0.95; }
        .star-fig.rouge  { color: #b01828; }
        .star-fig.violet { color: #a080b0; }
        .star-fig.bleu   { color: #a0b8d0; }
        .star-fig.rose   { color: #d8a0b0; }

        /* ---- Fond miroir ---- */
        .mirror-top, .mirror-bottom {
            width: 100%;
            position: fixed;
            left: 0; right: 0;
            pointer-events: none;
            z-index: 50;
        }
        .mirror-top { top: 0; height: 115px; }
        .mirror-bottom { bottom: 0; height: 105px; }

        .mirror-top svg, .mirror-bottom svg {
            width: 100%; height: 100%;
            display: block;
        }

        /* ---- Barre du titre ---- */
        .titre-barre {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 22px 20px 6px;
        }
        .titre-barre h1 {
            font-family: Georgia, serif;
            font-size: 26px;
            font-weight: normal;
            letter-spacing: 4px;
            color: var(--heading);
            margin: 0 0 10px;
            text-shadow:
                0 0 18px rgba(200, 200, 220, 0.55),
                0 0 40px rgba(176, 24, 40, 0.28);
        }
        .titre-barre .soustitre {
            display: inline-block;
            font-size: 15px;
            letter-spacing: 7px;
            text-transform: uppercase;
            color: #e0b0b8;
            font-style: italic;
            font-weight: bold;
            text-shadow:
                0 0 8px rgba(176, 24, 40, 0.7),
                0 0 20px rgba(176, 24, 40, 0.5),
                0 0 40px rgba(140, 26, 40, 0.35);
            padding: 0 10px;
        }

        /* ---- Canvas ---- */
        .canvas {
            position: relative;
            flex: 1;
            margin: 10px 0 0;
            overflow: hidden;
            cursor: grab;
            z-index: 5;
            touch-action: none;
        }
        .canvas.grabbing { cursor: grabbing; }

        #svg-tree {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            user-select: none;
        }

        /* ---- Contrôles ---- */
        .controls {
            position: fixed;
            bottom: 130px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 60;
        }
        .controls button {
            width: 42px; height: 42px;
            background: rgba(28, 22, 36, 0.92);
            border: 1px solid var(--silver-soft);
            border-radius: 4px;
            color: var(--silver);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
            backdrop-filter: blur(6px);
        }
        .controls button:hover {
            border-color: var(--red-bright);
            color: var(--red-bright);
            background: rgba(40, 30, 50, 0.95);
        }
        .controls button.petit { font-size: 13px; }

        /* ---- Pied ---- */
        .pied {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 0 20px 18px;
        }
        .pied a {
            color: var(--silver);
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }
        .pied a:hover { color: var(--red-bright); }

        /* ---- Info vide ---- */
        .info-vide {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-soft);
            font-style: italic;
            font-size: 15px;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        /* ---- Nœuds fancy ---- */
        .node { cursor: pointer; }

        .node rect.fond {
            fill: url(#nodeGrad);
            stroke: rgba(168, 168, 184, 0.4);
            stroke-width: 1;
            rx: 8;
            transition: stroke 0.25s ease;
        }
        .node rect.interne {
            fill: none;
            stroke: rgba(200, 200, 220, 0.12);
            stroke-width: 0.8;
            rx: 6;
            pointer-events: none;
        }
        .node rect.accent {
            fill: var(--red);
            rx: 2;
            pointer-events: none;
            transition: fill 0.25s ease;
        }
        .node:hover rect.fond { stroke: var(--red-bright); }
        .node:hover rect.accent { fill: var(--red-bright); }
        .node:hover { filter: drop-shadow(0 0 10px rgba(176, 24, 40, 0.5)); }

        .node .coin-lycoris {
            opacity: 0.75;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .node:hover .coin-lycoris { opacity: 1; }

        .node text.titre {
            fill: var(--heading);
            font-family: Georgia, serif;
            font-size: 13px;
            letter-spacing: 0.5px;
            pointer-events: none;
        }
        .node text.date {
            fill: var(--red-bright);
            font-family: Georgia, serif;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
        }
        .node text.lieu {
            fill: var(--alice);
            font-family: Georgia, serif;
            font-size: 10px;
            font-style: italic;
            pointer-events: none;
        }

        .tag-link {
            fill: none;
            stroke: rgba(216, 160, 176, 0.75);
            stroke-width: 1;
            stroke-dasharray: 4 5;
            opacity: 0.85;
            pointer-events: none;
        }

        .link {
            fill: none;
            stroke: rgba(168, 168, 184, 0.55);
            stroke-width: 1.3;
        }

        @media (max-width: 800px) {
            .mirror-top { height: 80px; }
            .mirror-bottom { height: 72px; }
            .titre-barre { padding: 14px 12px 4px; }
            .titre-barre h1 { font-size: 22px; letter-spacing: 3px; }
            .titre-barre .soustitre { font-size: 12px; letter-spacing: 5px; }
            .controls { bottom: 90px; right: 12px; }
            .controls button { width: 38px; height: 38px; font-size: 16px; }
        }
    </style>
</head>

<script>
    // ============================================================
    // ÉCLATS QUI TOMBENT — neutres (argent / alice)
    // ============================================================
    (function creerEclats() {
        const conteneur = document.getElementById('shards-bg');
        if (!conteneur) return;
        const estMobile = window.innerWidth < 800;
        const nb = estMobile ? 10 : 26;
        for (let i = 0; i < nb; i++) {

            svg.style.height = taille + 'px';
            svg.style.left = Math.random() * 100 + 'vw';

            svg.style.animationDelay = -(Math.random() * duree) + 's';

                ? 'rgba(160, 184, 208, ' + opacite + ')'
                : 'rgba(216, 216, 228, ' + opacite + ')';

            poly.setAttribute('points', '50,4 86,30 70,88 22,76 12,28');
            poly.setAttribute('fill', couleur);
            poly.setAttribute('stroke', 'rgba(232, 232, 244, 0.7)');

            svg.appendChild(poly);
            conteneur.appendChild(svg);

    })();

    // ============================================================
    // ÉTOILES FIGÉES — formes variées, palette rouge/violet/bleu/rose

    (function creerEtoiles() {
        const conteneur = document.getElementById('stars-bg');
        if (!conteneur) return;

        const couleurs = ['rouge', 'violet', 'bleu', 'rose'];

        // Différentes formes (paths SVG pour viewBox 0 0 100 100)

            // 4 branches
            'M50,4 Q53,47 96,50 Q53,53 50,96 Q47,53 4,50 Q47,47 50,4 Z',
            // 4 branches fines allongées
            'M50,0 Q52,48 100,50 Q52,52 50,100 Q48,52 0,50 Q48,48 50,0 Z',
            // Étoile 5 branches
            'M50,5 L61,38 L96,38 L68,59 L79,92 L50,72 L21,92 L32,59 L4,38 L39,38 Z',
            // Étoile 6 branches
            'M50,4 L60,35 L92,25 L72,50 L92,75 L60,65 L50,96 L40,65 L8,75 L28,50 L8,25 L40,35 Z',
            // Losange fin
            'M50,6 L62,50 L50,94 L38,50 Z',
            // Petit cercle lumineux
            'M50,50 m-30,0 a30,30 0 1,0 60,0 a30,30 0 1,0 -60,0',
            // Étoile 8 branches (éclat)
            'M50,2 L55,45 L98,50 L55,55 L50,98 L45,55 L2,50 L45,45 Z'
        ];

        const tailles = ['s', 's', 's', 'm', 'm', 'l'];
        const estMobile = window.innerWidth < 800;
        const nb = estMobile ? 22 : 60;

        for (let i = 0; i < nb; i++) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 100 100');

            const taille = tailles[Math.floor(Math.random() * tailles.length)];
            svg.classList.add('star-fig', taille, couleur);
            svg.style.left = Math.random() * 100 + 'vw';
            svg.style.top = Math.random() * 100 + 'vh';

            const forme = formes[Math.floor(Math.random() * formes.length)];
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', forme);
            path.setAttribute('fill', 'currentColor');
            path.setAttribute('fill-opacity', '0.9');

            svg.appendChild(path);
            conteneur.appendChild(svg);
        }
    })();

    // ============================================================
    // LAYOUT DE L'ARBRE
    // ============================================================
    const NODE_W = 240;
    const NODE_H = 78;
    const X_GAP = 320;
    const Y_GAP = 120;
    const ROOT_GAP = 60;

    function layout(arcs) {
        const byId = {};
        arcs.forEach(a => byId[a.id] = a);
        const children = {};
        arcs.forEach(a => children[a.id] = []);
        const roots = [];
        arcs.forEach(a => {
            if (a.parent_id && byId[a.parent_id]) {
                children[a.parent_id].push(a);
            } else {
                roots.push(a);
            }
        });
        function setDepth(arc, d) {
            arc._depth = d;
            children[arc.id].forEach(c => setDepth(c, d + 1));
        }
        roots.forEach(r => setDepth(r, 0));
        let yCursor = 0;
        function setY(arc) {
            const kids = children[arc.id];
            if (kids.length === 0) {
                arc._y = yCursor;
                yCursor += Y_GAP;
            } else {
                kids.forEach(setY);
                arc._y = (kids[0]._y + kids[kids.length - 1]._y) / 2;
            }
        }
        roots.forEach((r, i) => {
            setY(r);
            if (i < roots.length - 1) yCursor += ROOT_GAP;
        });
        arcs.forEach(a => { a._x = a._depth * X_GAP; });
        return { byId, children, roots };
    }

    const svg = document.getElementById("svg-tree");
    const group = document.getElementById("tree-group");
    const canvas = document.getElementById("canvas");
    const infoVide = document.getElementById("info-vide");

    let panX = 0, panY = 0, zoom = 1;
    let contentBounds = null;

    function appliquerTransform() {
        const t = "translate(" + panX + "," + panY + ") scale(" + zoom + ")";
        group.setAttribute("transform", t);
        const tagGroup = document.getElementById("tag-links");
        if (tagGroup) tagGroup.setAttribute("transform", t);
    }

    function dessinerArbre(arcs) {
        group.innerHTML = "";
        if (!arcs || arcs.length === 0) {
            infoVide.textContent = "Aucun arc à afficher pour l'instant.";
            infoVide.style.display = "flex";
            return;
        }
        infoVide.style.display = "none";
        const data = layout(arcs);
        window.__arcs = arcs;

        arcs.forEach(arc => {
            if (arc.parent_id && data.byId[arc.parent_id]) {
                const p = data.byId[arc.parent_id];
                const px = p._x + NODE_W / 2;
                const py = p._y;
                const cx = arc._x - NODE_W / 2;
                const cy = arc._y;
                const midX = (px + cx) / 2;
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("class", "link");
                path.setAttribute("d",
                    "M" + px + "," + py +
                    " C" + midX + "," + py +
                    " " + midX + "," + cy +
                    " " + cx + "," + cy);
                group.appendChild(path);
            }
        });

        arcs.forEach(arc => group.appendChild(construireNoeudSVG(arc)));

        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        arcs.forEach(a => {
            minX = Math.min(minX, a._x - NODE_W / 2);
            maxX = Math.max(maxX, a._x + NODE_W / 2);
            minY = Math.min(minY, a._y - NODE_H / 2);
            maxY = Math.max(maxY, a._y + NODE_H / 2);
        });
        contentBounds = { minX, minY, maxX, maxY };
        recentrer();
    }

    function construireNoeudSVG(arc) {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", "node");
        g.setAttribute("transform",
            "translate(" + (arc._x - NODE_W / 2) + "," + (arc._y - NODE_H / 2) + ")");

        const fond = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        fond.setAttribute("class", "fond");
        fond.setAttribute("width", NODE_W);
        fond.setAttribute("height", NODE_H);
        g.appendChild(fond);

        const accent = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        accent.setAttribute("class", "accent");
        accent.setAttribute("x", 0);
        accent.setAttribute("y", 10);
        accent.setAttribute("width", 3);
        accent.setAttribute("height", NODE_H - 20);
        g.appendChild(accent);

        const interne = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        interne.setAttribute("class", "interne");
        interne.setAttribute("x", 7);
        interne.setAttribute("y", 6);
        interne.setAttribute("width", NODE_W - 14);
        interne.setAttribute("height", NODE_H - 12);
        g.appendChild(interne);

        const lycoris = document.createElementNS("http://www.w3.org/2000/svg", "use");
        lycoris.setAttribute("href", "#lycoris-mini");
        lycoris.setAttribute("x", NODE_W - 26);
        lycoris.setAttribute("y", NODE_H - 26);
        lycoris.setAttribute("width", 20);
        lycoris.setAttribute("height", 20);
        lycoris.setAttribute("class", "coin-lycoris");
        g.appendChild(lycoris);

        const titre = document.createElementNS("http://www.w3.org/2000/svg", "text");
        titre.setAttribute("class", "titre");
        titre.setAttribute("x", 16);
        titre.setAttribute("y", 26);
        const titreTxt = (arc.titre || "").length > 30
            ? arc.titre.slice(0, 28) + "…"
            : (arc.titre || "");
        titre.textContent = titreTxt;
        g.appendChild(titre);

        if (arc.date_univers && arc.date_univers.trim()) {
            const date = document.createElementNS("http://www.w3.org/2000/svg", "text");
            date.setAttribute("class", "date");
            date.setAttribute("x", 16);
            date.setAttribute("y", 48);
            date.textContent = arc.date_univers.slice(0, 32);
            g.appendChild(date);
        }

        if (arc.lieu && arc.lieu.trim()) {
            const lieu = document.createElementNS("http://www.w3.org/2000/svg", "text");
            lieu.setAttribute("class", "lieu");
            lieu.setAttribute("x", 16);
            lieu.setAttribute("y", 64);
            lieu.textContent = arc.lieu.slice(0, 28);
            g.appendChild(lieu);
        }

        // Survol : affiche les liens de tag
        g.addEventListener("mouseenter", function () {
            dessinerLiensTag(arc);
        });
        g.addEventListener("mouseleave", function () {
            effacerLiensTag();
        });

        g.addEventListener("click", function (e) {
            e.stopPropagation();
            window.location.href = "arc.html#" + arc.id;
        });
        return g;
    }

    // ---- Liens par tags ----

    const tagLinksGroup = document.getElementById("tag-links");

    function normaliserTag(t) {
        return (t || "").toString().toLowerCase().trim();
    }

    function tagsDeArc(arc) {
        const raw = arc.tags || [];
        if (!Array.isArray(raw)) return [];
        return raw.map(normaliserTag).filter(function (t) { return t.length > 0; });
    }

    function effacerLiensTag() {
        tagLinksGroup.innerHTML = "";
    }

    function dessinerLiensTag(arcCible) {
        effacerLiensTag();
        const tagsCible = tagsDeArc(arcCible);
        if (tagsCible.length === 0) return;

        const tous = window.__arcs || [];
        tous.forEach(function (autre) {
            if (autre.id === arcCible.id) return;
            const tagsAutre = tagsDeArc(autre);
            const commun = tagsCible.some(function (t) {
                return tagsAutre.indexOf(t) !== -1;
            });
            if (!commun) return;

            const x1 = arcCible._x;
            const y1 = arcCible._y;
            const x2 = autre._x;
            const y2 = autre._y;
            const mx = (x1 + x2) / 2;
            const my = (y1 + y2) / 2 - 30;

            const ligne = document.createElementNS("http://www.w3.org/2000/svg", "path");
            ligne.setAttribute("class", "tag-link");
            ligne.setAttribute("d",
                "M" + x1 + "," + y1 +
                " Q" + mx + "," + my +
                " " + x2 + "," + y2);
            tagLinksGroup.appendChild(ligne);
        });
    }

    function recentrer() {
        if (!contentBounds) return;
        const W = canvas.clientWidth;
        const H = canvas.clientHeight;
        const cw = contentBounds.maxX - contentBounds.minX;
        const ch = contentBounds.maxY - contentBounds.minY;
        const padX = 80, padY = 60;
        const scaleX = (W - padX * 2) / (cw || 1);
        const scaleY = (H - padY * 2) / (ch || 1);
        zoom = Math.min(scaleX, scaleY, 1.4);
        zoom = Math.max(0.15, zoom);
        const cx = (contentBounds.minX + contentBounds.maxX) / 2;
        const cy = (contentBounds.minY + contentBounds.maxY) / 2;
        panX = W / 2 - cx * zoom;
        panY = H / 2 - cy * zoom;
        appliquerTransform();
    }

    canvas.addEventListener("wheel", function (e) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const f = e.deltaY < 0 ? 1.12 : 0.89;
        const nz = Math.max(0.15, Math.min(4, zoom * f));
        panX = mx - (mx - panX) * (nz / zoom);
        panY = my - (my - panY) * (nz / zoom);
        zoom = nz;
        appliquerTransform();
    }, { passive: false });

    let dragging = false, lastX = 0, lastY = 0;
    canvas.addEventListener("mousedown", function (e) {
        dragging = true; lastX = e.clientX; lastY = e.clientY;
        canvas.classList.add("grabbing");
    });
    window.addEventListener("mousemove", function (e) {
        if (!dragging) return;
        panX += e.clientX - lastX;
        panY += e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        appliquerTransform();
    });
    window.addEventListener("mouseup", function () {
        dragging = false; canvas.classList.remove("grabbing");
    });

    let touchStart = null;
    canvas.addEventListener("touchstart", function (e) {
        if (e.touches.length === 1) {
            touchStart = { mode: "pan", x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            touchStart = { mode: "pinch", dist: Math.hypot(dx, dy) };
        }
    }, { passive: true });

    canvas.addEventListener("touchmove", function (e) {
        if (!touchStart) return;
        if (touchStart.mode === "pan" && e.touches.length === 1) {
            e.preventDefault();
            panX += e.touches[0].clientX - touchStart.x;
            panY += e.touches[0].clientY - touchStart.y;
            touchStart.x = e.touches[0].clientX;
            touchStart.y = e.touches[0].clientY;
            appliquerTransform();
        } else if (touchStart.mode === "pinch" && e.touches.length === 2) {
            e.preventDefault();
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            zoom = Math.max(0.15, Math.min(4, zoom * (dist / touchStart.dist)));
            touchStart.dist = dist;
            appliquerTransform();
        }
    }, { passive: false });

    canvas.addEventListener("touchend", function () { touchStart = null; });

    document.getElementById("btn-in").addEventListener("click", function () {
        zoom = Math.min(4, zoom * 1.25); appliquerTransform();
    });
    document.getElementById("btn-out").addEventListener("click", function () {
        zoom = Math.max(0.15, zoom * 0.8); appliquerTransform();
    });
    document.getElementById("btn-reset").addEventListener("click", recentrer);

    async function init() {
        try {
            const arcs = await chargerArcsPourArbre();
            dessinerArbre(arcs);
        } catch (err) {
            console.error(err);
            infoVide.textContent = "Impossible de charger les arcs.";
            infoVide.style.display = "flex";
        }
    }
    init();

    let resizeTimer = null;
    window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(recentrer, 200);
    });
</script>
