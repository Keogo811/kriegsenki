<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Univers — Krieg Senki</title>
    <style>
        :root {
            --bg: #0f0c14;
            --void: #060410;
            --card-bg: #1c1624;
            --text: #cdc2b8;
            --text-soft: #8a8088;
            --heading: #c8bcb4;
            --silver: #a8a8b8;
            --silver-bright: #d8d8e4;
            --silver-soft: #807f8c;
            --red: #8c1a28;
            --red-bright: #b01828;
            --mauve: #8a6a88;
            --alice: #a0b8d0;
            --border: rgba(168, 168, 184, 0.2);
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 16px;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ---- Fond : miroir brisé avec grand vide ---- */
        .mirror-top, .mirror-bottom {
            width: 100%;
            position: fixed;
            left: 0;
            right: 0;
            pointer-events: none;
            z-index: 50;
        }
        .mirror-top { top: 0; height: 200px; }
        .mirror-bottom { bottom: 0; height: 180px; }

        .mirror-top svg, .mirror-bottom svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ---- Barre du titre ---- */
        .titre-barre {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 22px 20px 10px;
        }
        .titre-barre h1 {
            font-family: Georgia, serif;
            font-size: 26px;
            font-weight: normal;
            letter-spacing: 4px;
            color: var(--heading);
            margin: 0 0 4px;
            text-shadow:
                0 0 18px rgba(200, 200, 220, 0.55),
                0 0 40px rgba(176, 24, 40, 0.28);
        }
        .titre-barre .soustitre {
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--text-soft);
            font-style: italic;
        }

        /* ---- Zone de l'arbre (pan/zoom) ---- */
        .canvas {
            position: relative;
            flex: 1;
            margin: 10px 0 0;
            overflow: hidden;
            cursor: grab;
            z-index: 5;
            touch-action: none;
        }
        .canvas.grabbing { cursor: grabbing; }

        #svg-tree {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            user-select: none;
        }

        /* ---- Contrôles ---- */
        .controls {
            position: fixed;
            bottom: 200px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 60;
        }
        .controls button {
            width: 42px; height: 42px;
            background: rgba(28, 22, 36, 0.92);
            border: 1px solid var(--silver-soft);
            border-radius: 4px;
            color: var(--silver);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
            backdrop-filter: blur(6px);
        }
        .controls button:hover {
            border-color: var(--red-bright);
            color: var(--red-bright);
            background: rgba(40, 30, 50, 0.95);
        }
        .controls button.petit { font-size: 13px; }

        /* ---- Pied ---- */
        .pied {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 0 20px 20px;
        }
        .pied a {
            color: var(--silver);
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }
        .pied a:hover { color: var(--red-bright); }

        /* ---- Info vide ---- */
        .info-vide {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-soft);
            font-style: italic;
            font-size: 15px;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        /* ---- Nœuds (SVG) ---- */
        .node {
            cursor: pointer;
        }
        .node rect {
            fill: var(--card-bg);
            stroke: rgba(168, 168, 184, 0.35);
            stroke-width: 1;
            rx: 6;
            transition: fill 0.2s ease, stroke 0.2s ease;
        }
        .node:hover rect {
            fill: #241d2e;
            stroke: var(--red-bright);
        }
        .node text.titre {
            fill: var(--heading);
            font-family: Georgia, serif;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        .node text.date {
            fill: var(--red-bright);
            font-family: Georgia, serif;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .node text.lieu {
            fill: var(--alice);
            font-family: Georgia, serif;
            font-size: 10px;
            font-style: italic;
        }

        .link {
            fill: none;
            stroke: rgba(168, 168, 184, 0.45);
            stroke-width: 1.2;
        }

        /* ---- Mobile ---- */
        @media (max-width: 800px) {
            .mirror-top { height: 130px; }
            .mirror-bottom { height: 120px; }
            .titre-barre { padding: 16px 14px 6px; }
            .titre-barre h1 { font-size: 22px; letter-spacing: 3px; }
            .controls { bottom: 140px; right: 12px; }
            .controls button { width: 38px; height: 38px; font-size: 16px; }
        }
    </style>
</head>

<!-- ============================================================
     SCRIPTS
     ============================================================ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data/config.js"></script>
<script src="data/api.js"></script>
<script>
    // ============================================================
    // LAYOUT DE L'ARBRE
    // ============================================================
    const NODE_W = 240;
    const NODE_H = 78;
    const X_GAP = 320;
    const Y_GAP = 120;
    const ROOT_GAP = 60;

    function layout(arcs) {
        const byId = {};
        arcs.forEach(a => byId[a.id] = a);

        const children = {};
        arcs.forEach(a => children[a.id] = []);

        const roots = [];
        arcs.forEach(a => {
            if (a.parent_id && byId[a.parent_id]) {
                children[a.parent_id].push(a);
            } else {
                roots.push(a);
            }
        });

        // Profondeur (x)
        function setDepth(arc, d) {
            arc._depth = d;
            children[arc.id].forEach(c => setDepth(c, d + 1));
        }
        roots.forEach(r => setDepth(r, 0));

        // Y par post-ordre
        let yCursor = 0;
        function setY(arc) {
            const kids = children[arc.id];
            if (kids.length === 0) {
                arc._y = yCursor;
                yCursor += Y_GAP;
            } else {
                kids.forEach(setY);
                arc._y = (kids[0]._y + kids[kids.length - 1]._y) / 2;
            }
        }
        roots.forEach((r, i) => {
            setY(r);
            if (i < roots.length - 1) yCursor += ROOT_GAP;
        });

        // X
        arcs.forEach(a => {
            a._x = a._depth * X_GAP;
        });

        return { byId, children, roots };
    }

    // ============================================================
    // RENDU
    // ============================================================
    const svg = document.getElementById("svg-tree");
    const group = document.getElementById("tree-group");
    const canvas = document.getElementById("canvas");
    const infoVide = document.getElementById("info-vide");

    let panX = 0, panY = 0, zoom = 1;
    let contentBounds = null;

    function appliquerTransform() {
        group.setAttribute("transform",
            "translate(" + panX + "," + panY + ") scale(" + zoom + ")");
    }

    function dessinerArbre(arcs) {
        group.innerHTML = "";

        if (!arcs || arcs.length === 0) {
            infoVide.textContent = "Aucun arc à afficher pour l'instant.";
            infoVide.style.display = "flex";
            return;
        }
        infoVide.style.display = "none";

        const data = layout(arcs);

        // Liens d'abord (en dessous)
        arcs.forEach(arc => {
            if (arc.parent_id && data.byId[arc.parent_id]) {
                const p = data.byId[arc.parent_id];
                const px = p._x + NODE_W / 2;
                const py = p._y;
                const cx = arc._x - NODE_W / 2;
                const cy = arc._y;
                const midX = (px + cx) / 2;

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("class", "link");
                path.setAttribute("d",
                    "M" + px + "," + py +
                    " C" + midX + "," + py +
                    " " + midX + "," + cy +
                    " " + cx + "," + cy);
                group.appendChild(path);
            }
        });

        // Nœuds
        arcs.forEach(arc => {
            group.appendChild(construireNoeudSVG(arc));
        });

        // Calcul des bornes pour recentrer plus tard
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        arcs.forEach(a => {
            minX = Math.min(minX, a._x - NODE_W / 2);
            maxX = Math.max(maxX, a._x + NODE_W / 2);
            minY = Math.min(minY, a._y - NODE_H / 2);
            maxY = Math.max(maxY, a._y + NODE_H / 2);
        });
        contentBounds = { minX, minY, maxX, maxY };

        recentrer();
    }

    function construireNoeudSVG(arc) {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", "node");
        g.setAttribute("transform",
            "translate(" + (arc._x - NODE_W / 2) + "," + (arc._y - NODE_H / 2) + ")");

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("width", NODE_W);
        rect.setAttribute("height", NODE_H);
        g.appendChild(rect);

        // Titre (tronqué si trop long)
        const titre = document.createElementNS("http://www.w3.org/2000/svg", "text");
        titre.setAttribute("class", "titre");
        titre.setAttribute("x", 14);
        titre.setAttribute("y", 26);
        const titreTxt = (arc.titre || "").length > 32
            ? arc.titre.slice(0, 30) + "…"
            : (arc.titre || "");
        titre.textContent = titreTxt;
        g.appendChild(titre);

        // Date
        if (arc.date_univers && arc.date_univers.trim()) {
            const date = document.createElementNS("http://www.w3.org/2000/svg", "text");
            date.setAttribute("class", "date");
            date.setAttribute("x", 14);
            date.setAttribute("y", 48);
            date.textContent = arc.date_univers.slice(0, 34);
            g.appendChild(date);
        }

        // Lieu
        if (arc.lieu && arc.lieu.trim()) {
            const lieu = document.createElementNS("http://www.w3.org/2000/svg", "text");
            lieu.setAttribute("class", "lieu");
            lieu.setAttribute("x", 14);
            lieu.setAttribute("y", 64);
            lieu.textContent = arc.lieu.slice(0, 30);
            g.appendChild(lieu);
        }

        // Clic → page de l'arc
        g.addEventListener("click", function (e) {
            e.stopPropagation();
            window.location.href = "arc.html#" + arc.id;
        });

        return g;
    }

    // ============================================================
    // PAN / ZOOM
    // ============================================================
    function recentrer() {
        if (!contentBounds) return;
        const W = canvas.clientWidth;
        const H = canvas.clientHeight;
        const cw = contentBounds.maxX - contentBounds.minX;
        const ch = contentBounds.maxY - contentBounds.minY;
        const padX = 80, padY = 80;
        const scaleX = (W - padX * 2) / (cw || 1);
        const scaleY = (H - padY * 2) / (ch || 1);
        zoom = Math.min(scaleX, scaleY, 1.4);
        zoom = Math.max(0.15, zoom);

        const cx = (contentBounds.minX + contentBounds.maxX) / 2;
        const cy = (contentBounds.minY + contentBounds.maxY) / 2;
        panX = W / 2 - cx * zoom;
        panY = H / 2 - cy * zoom;
        appliquerTransform();
    }

    // Zoom à la molette
    canvas.addEventListener("wheel", function (e) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const facteur = e.deltaY < 0 ? 1.12 : 0.89;
        const nouveauZoom = Math.max(0.15, Math.min(4, zoom * facteur));
        // Zoom centré sur le curseur
        panX = mx - (mx - panX) * (nouveauZoom / zoom);
        panY = my - (my - panY) * (nouveauZoom / zoom);
        zoom = nouveauZoom;
        appliquerTransform();
    }, { passive: false });

    // Drag souris
    let dragging = false, lastX = 0, lastY = 0;
    canvas.addEventListener("mousedown", function (e) {
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        canvas.classList.add("grabbing");
    });
    window.addEventListener("mousemove", function (e) {
        if (!dragging) return;
        panX += e.clientX - lastX;
        panY += e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        appliquerTransform();
    });
    window.addEventListener("mouseup", function () {
        dragging = false;
        canvas.classList.remove("grabbing");
    });

    // Touch : drag + pinch
    let touchStart = null;
    canvas.addEventListener("touchstart", function (e) {
        if (e.touches.length === 1) {
            touchStart = {
                mode: "pan",
                x: e.touches[0].clientX,
                y: e.touches[0].clientY
            };
        } else if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            touchStart = { mode: "pinch", dist: Math.hypot(dx, dy) };
        }
    }, { passive: true });

    canvas.addEventListener("touchmove", function (e) {
        if (!touchStart) return;
        if (touchStart.mode === "pan" && e.touches.length === 1) {
            e.preventDefault();
            panX += e.touches[0].clientX - touchStart.x;
            panY += e.touches[0].clientY - touchStart.y;
            touchStart.x = e.touches[0].clientX;
            touchStart.y = e.touches[0].clientY;
            appliquerTransform();
        } else if (touchStart.mode === "pinch" && e.touches.length === 2) {
            e.preventDefault();
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            const nouveauZoom = Math.max(0.15, Math.min(4, zoom * (dist / touchStart.dist)));
            zoom = nouveauZoom;
            touchStart.dist = dist;
            appliquerTransform();
        }
    }, { passive: false });

    canvas.addEventListener("touchend", function () { touchStart = null; });

    // Boutons
    document.getElementById("btn-in").addEventListener("click", function () {
        zoom = Math.min(4, zoom * 1.25);
        appliquerTransform();
    });
    document.getElementById("btn-out").addEventListener("click", function () {
        zoom = Math.max(0.15, zoom * 0.8);
        appliquerTransform();
    });
    document.getElementById("btn-reset").addEventListener("click", recentrer);

    // ============================================================
    // DÉMARRAGE
    // ============================================================
    async function init() {
        try {
            const arcs = await chargerArcsPourArbre();
            dessinerArbre(arcs);
        } catch (err) {
            console.error(err);
            infoVide.textContent = "Impossible de charger les arcs.";
            infoVide.style.display = "flex";
        }
    }
    init();

    // Redessiner au redimensionnement
    let resizeTimer = null;
    window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(recentrer, 200);
    });
</script>

</body>
